name: Validate and build VentLab
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium firefox webkit
      - name: Exercise the production build in three browser engines
        run: >-
          python scripts/browser_smoke.py --engines chromium firefox webkit
          --axe-script web/node_modules/axe-core/axe.min.js --report browser-qa.json
      - name: Attach the browser verification report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ventlab-browser-qa
          path: browser-qa.json
          retention-days: 7
          if-no-files-found: warn
      - name: Attach the tested static build to the review run
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ventlab-web
          path: web/dist/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          path: web/dist
  publish:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed site
        id: deployment
        uses: actions/deploy-pages@v4
